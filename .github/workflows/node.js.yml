# CI/CD for MeenaGPT (Node.js + Express backend)
# CI: install, lint, build and test on supported Node versions.
# CD: on push to main, trigger a Render deploy via a deploy hook.
# Setup: add RENDER_DEPLOY_HOOK_URL under Settings > Secrets and variables > Actions.

name: MeenaGPT CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel older runs of the same branch/PR when a new commit arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 18 is end-of-life, so only maintained versions are tested
        node-version: [20.x, 22.x]

    # Dummy values so the app can load config during tests (never use real secrets in CI)
    env:
      NODE_ENV: test
      PORT: 5000
      JWT_SECRET: ci_test_secret
      OPENAI_API_KEY: ci_dummy_key
      MONGO_URL: mongodb://localhost:27017/meenagpt_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

  deploy:
    name: Deploy to Render
    needs: build
    # Deploy only on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
